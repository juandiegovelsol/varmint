difficulty_explanation = """
The instruction deliberately describes the symptoms in general terms and does not enumerate
the distinct defects or name the missing UI affordances -- the attached screenshots are the
only place the individual failure modes (which rows lack a way to be removed, which
half-filled inputs are silently dropped vs. silently kept, what the error banner does and
doesn't show, which blank entries get persisted) are actually shown, so the fix cannot be
scoped correctly from the text alone.
The human fix touches 5 source file(s) (app/eventyay/orga/forms/event.py, app/eventyay/orga/templates/orga/settings/review.html, app/eventyay/orga/views/event.py, app/eventyay/static/orga/css/_layout.css...) and the change is behavioural
rather than cosmetic-only, so reproducing it requires reading the surrounding code, not
just the issue text.
"""
