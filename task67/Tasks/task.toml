task_type = "visual_bug_fix"
language = "C++"
framework = "SDL2"
cross_file = true
visual_essentiality = "required"
difficulty = "hard"
difficulty_explanation = """The screenshots are essential to confirm which popup appears wrongly and which sub-regions of the scenario list are affected. The fix requires understanding the event-handling architecture of the scenario selection dialog: how right-click events are dispatched across the listbox and its parent dialog, how click regions are defined and ordered for each column, and why the current handler intercepts clicks meant for icon columns. The developer must read the rendering code to determine the pixel geometry of each column, separate the map-name column from the icon columns, and restructure the event priority. Two source files must be modified cross-file. The column geometry must be derived from the layout code. Beyond the click-handling defect, one of the detail-panel layout constants used to position rendered text no longer matches what the screenshots show; it has no matching value or formula anywhere else in the file, so it can only be corrected by measuring the reference layout in the screenshots and is easy to miss while focused on the click-handling fix."""
files_edited = [
  "src/fheroes2/dialog/dialog_selectscenario.cpp",
  "src/fheroes2/dialog/dialog_selectscenario.h"
]
