difficulty_explanation = """
The screenshots are what establish the defect: one slot on the printed sheet carries a coloured strip and a supporter mark detached from its badge, while every other slot carries only text. The instruction names no file, class, option or remedy, so the agent must find the badge export path itself and work out why a badge that prints completely on its own loses everything but its text once several are tiled onto one sheet. The change spans the PDF layer, the plugin's export path, its view, its app registration and the layout editor, and it must not disturb the single-badge path, the sheet count, the sheet size, the error raised when no badge product exists, or the attachment the export returns.
"""
