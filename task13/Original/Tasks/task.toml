difficulty_explanation = """The screenshot is required to identify the defect: the issue title ('horizontal + vertical scroll looks bad on chrome') is too vague to determine whether the problem is the scrollbar thumb, track, corner, or overall styling — only by examining the screenshot does it become clear that the white artifact is specifically at the ::-webkit-scrollbar-corner intersection of both scrollbars. However, once the defect location is identified from the image, the fix is a well-known WebKit CSS recipe: adding '::-webkit-scrollbar-corner { -webkit-appearance: none; appearance: none; }' to the global stylesheet. The change is a single-file, 4-line CSS addition with no cross-file coordination, no logic changes, and no test infrastructure to update. Measured: claude-code @ anthropic/claude-opus-4-8 solves this 6/6 (mean reward 1.000 over one 1-trial and one 5-trial serial run, ~1m45s each), so the 'easy' tier is empirical rather than estimated. The verifier still discriminates correctly (nop 0.0, oracle 1.0, single-hard-coded-colour corner 0.5, gutted stylesheet 0.0) -- see VALIDATION.md."""
