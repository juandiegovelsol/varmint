difficulty_explanation = """
The image is needed because the bug is a timing/degree defect, not a structural or visual-layout one: the only way to know that affected coins reach the chasm floor almost instantly and then show essentially zero pixel motion for the rest of a 14-second clip (rather than, say, sinking somewhat slower than ideal) is to watch the rendered frames over time; the text report can describe the end state but not the precise near-zero-motion evidence that corroborates the test's tight numeric thresholds (y<300 at 1s, y<374 at 3s).

The fix itself is confined to a single function in a single file (HeavyCoin::update in src/object/coin.cpp), but it is not a trivial one-line change: nothing in the base code hints at the solution (the function body is a bare '// Enable physics.' comment), and the correct approach -- checking the coin's bounding box against Sector::is_free_of_tiles(..., Tile::WATER), then adjusting m_physic's gravity modifier and capping downward velocity -- mirrors a pattern that only exists in an unrelated class hierarchy (BadGuy::update in src/badguy/badguy.cpp), which the agent has to go discover and recognize as the right analogy. The agent also has to choose a gravity modifier and velocity cap that are not just qualitatively floatier but quantitatively tight enough to satisfy the f2p assertions' specific y-position thresholds at specific simulated times, so a shallow or hand-wavy fix (e.g. just zeroing gravity in water, or capping velocity without reducing gravity) would plausibly still fail one of the two f2p checks.
"""
files_edited = [
  "src/object/coin.cpp",
]
