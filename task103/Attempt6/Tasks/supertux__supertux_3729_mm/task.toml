difficulty_explanation = """
Five independent defects in the coin-burst pipeline, spread over two files (src/object/coin_explode.cpp and src/object/coin.cpp), all visible only as motion in the attached recording and all affecting the same coins at once: (1) the bonus block's burst throws every coin to one side, and half of them straight down onto the block, because the mirrored half of the velocity fan flips the wrong axis; (2) heavy coins ignore water entirely, so coins that fall into the flooded chasm reach the bottom at full speed (the upstream issue #3729); (3) a coin that lands keeps its horizontal speed and skates along the floor forever, bouncing from wall to wall; (4) the released coins are put in a collision group that never meets the player, so Tux swims straight through them without picking them up; (5) the landing bounce threshold is so low that every landing counts as a bounce, so a landed coin keeps hopping on the floor instead of coming to rest.

The text names none of these. The agent has to step through the clip from the burst onward and separate five overlapping symptoms (one-sided/downward launch, no slowdown in water, endless sliding and hopping on the basin floor, coins Tux passes through without collecting), then map each to its own code path: the fan construction in CoinExplode::update, HeavyCoin::update (no water handling at all; the right pattern exists only in unrelated classes such as Rock and BadGuy), the landing branch of HeavyCoin::collision_solid (two defects there), and the collision group set in the HeavyCoin constructor. Fixing the most obvious symptom (water) leaves the other two in place, and copying Rock's water code verbatim (gravity modifier only) still lets coins that hit the water fast plunge to the bottom, which the clip shows and the instruction calls out. Each defect has its own behavioural f2p test run in the real game binary (scripted levels, no source inspection), with thresholds checked against several independent correct fixes.
"""
files_edited = [
  "src/object/coin.cpp",
  "src/object/coin_explode.cpp",
]
f2p = [
  "HeavyCoinWaterTest.floats_in_water_by_1s",
  "HeavyCoinWaterTest.still_sinking_at_1_6s",
