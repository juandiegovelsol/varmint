difficulty_explanation = """
After hardening, instruction.md gives only the user-visible symptom (the colored follow border is
painted behind the on-screen panels and is clipped at each panel's edges instead of forming one
continuous frame) plus the screenshot. It names no file, component, CSS class, layer variable, or
mechanism, and it carries no link back to the source project, so locating the code is now real work.
The agent has to read the poster to recognise this as an occlusion/layering defect (the frame is
being painted underneath the panels) and then find the follow-indicator render on its own. The fix
is conceptually non-trivial even once found: raising the indicator's z-index cannot work, because it
renders inside a container whose own stacking context is capped below the UI layer's, and a child's
z-index can never escape its ancestor's stacking context. The only fix that works is relocating the
indicator's render out of the canvas-overlay component and into the UI-layer component, placed after
the panel groups so ordinary paint order puts it on top, and kept there in every layout including the
minimal/focus layout where the usual panels are swapped out. The screenshot is required because, with
the recipe stripped, it is the only evidence that this is an occlusion bug rather than an unrelated
border-styling problem, and the only thing that shows the frame breaking precisely at the panel edges.
"""
files_edited = [
  "packages/tldraw/src/lib/ui/TldrawUi.tsx",
  "packages/tldraw/src/lib/ui.css"
]
f2p = [
  "places the following indicator inside the UI layout, not the canvas-in-front overlay",
  "renders the following indicator after the toolbar and menu panels in the UI layout",
  "still places the following indicator inside the UI layout while in focus mode"
]
p2p = [
