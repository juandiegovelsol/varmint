difficulty_explanation = """
The one screenshot is the only record of how the tile is supposed to look, and it is the
only way to tell that the standing text is being clipped by the hover border at all - the
instructions name no mechanism for that defect, so the fix it needs can only be recovered
by reading the image. The instructions also name three further symptoms in the same tile,
each in one plain sentence with no mechanism, coordinate, or file named: temperament words
sometimes read in the wrong order, some Clan names have "Clan" on the wrong end, and one
relationship value gets the wrong label. Reproducing any of the four requires reading
create_other_clan_selection_box (scripts/screens/LeaderDenScreen.py) and its one call into
scripts/clan.py end to end, since none of the four share a root cause with each other or
with the reported bug, and none can be found by grepping the instructions for a keyword.
Reward is all-or-nothing across 9 f2p and 4 p2p tests, so a fix that only addresses the
screenshot's defect still scores zero.
"""
