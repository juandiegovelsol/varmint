difficulty_explanation = """Two defects share one root cause and the prompt describes neither of them. It states only the invariant that must hold - label, drawn series and hovered series agree on every spoke - and then shows two renders. Every symptom, and therefore the entire diagnosis, has to be read off the pixels; there is no corrected-state render to compare against either.

bug.png carries three separate signals that exist nowhere in the text: the cursor sits beside one spoke while the tooltip names another, the tooltip box is parked in the top-left corner of the plot rather than near the cursor, and the readout resolves to the plot origin. Together they identify a failed interval lookup falling through to a sentinel, not a styling or rendering problem, and the cursor's position is the only indication of which arc of the circle is affected. mismatch.png supplies the second defect with no pointer involved at all: next to the data table, the spoke labelled with the largest value is plotted shortest. Recognising that the displacement is a whole number of spokes - and therefore an offset applied in the wrong direction rather than an arithmetic slip - is what points at the band offset. Neither screenshot is described in words, so an agent that does not read them has only "the chart is inconsistent with its own axis" to work from.

Localizing means finding that the offset is computed independently in three places that must agree: the rendered axis ticks, the tooltip's own tick list, and the graphical item's points. Only the last one is right. The two wrong ones derive the offset's sign from the axis range direction, so they agree with each other and with the geometry on a descending circle (the default) and drift two full bands away from it on an ascending one. Fixing only the axis ticks leaves the tooltip disagreeing with the labels; fixing only the tooltip leaves the labels disagreeing with the data. The pass-to-pass consistency guard fails on either half, so a partial fix cannot score 1.0.

The wrap-around arc is the more discoverable half, and a general nearest-tick rewrite of the interval search closes it - that alone passes all five pointer-attribution tests and still fails both placement tests, because it never touches the offset. Hardcoding the arc from the screenshot fails three of the five pointer tests, which use layouts whose dead arcs sit in three other places (4, 5 and 6 series over 0..360, 45..405 and 90..450)."""
