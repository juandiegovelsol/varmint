difficulty_explanation = """The instruction never names the affected stat, the affected screen region or the affected game state — all of that is only recoverable from the two screenshots. Reading them yields the literal strings rendered by the header ("You have ... antimatter.", "AD Tickspeed: ... / sec", "... faster per upgrade"), which locate HeaderCenterContainer and the per-theme branch inside it. Diagnosing the root cause means noticing that the Classic branch renders a row whose content is suppressed while Tickspeed is still locked, whereas the Modern branch renders an unconditional info block. Acting on the no-lost-controls constraint is the cross-file half: the Classic header row is also the only Tickspeed purchase control Classic players have before Reality, because ClassicAntimatterDimensionsTab gates its own row behind v-if=hasRealityButton, so unifying the header forces that gate to be removed as well."""
