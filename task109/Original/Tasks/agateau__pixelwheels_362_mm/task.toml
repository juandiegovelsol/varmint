visual_essentiality = "required"
difficulty = "hard"
difficulty_explanation = """
The image is required because the defect is a draw-order/occlusion problem: nothing about it can be inferred from code comments or test names alone (ZLevel.java and GameRenderer.java carry no TODO or note about this), and the only way to confirm which object should occlude which, and that the rocket is fully opaque over the stripes rather than merely close to them, is to look at the rendered frame. The repo also gives no test or comment pointing at this before the fix, so an engineer without the video has nothing but the vague issue title to go on.

The fix itself touches six files across three layers of the rendering pipeline: the ZLevel enum has to be restructured (not just reordered — FLYING is split into FLYING_LOW for missiles and FLYING_HIGH for helicopters/carried vehicles, and a new FG_LAYERS level is inserted) and every call site that branches on the old ZLevel.FLYING or draws the foreground tile layer at ZLevel.OBSTACLES has to move in lockstep (Missile.java, VehicleRenderer.java, GameRenderer.java, Helicopter.java, DropLocationDebugObject.java). A shallow fix that just swaps two enum values, or moves only the foreground-layer draw call without also separating the helicopter's high-altitude draw level, would still leave the helicopter shadow or carried-vehicle cases broken, or would reintroduce the missile-over-foreground bug in a different order. Getting all six files internally consistent, and keeping the enum's ordering semantics documented, is what makes this a real cross-file architecture fix rather than a one-line tweak.
"""
files_edited = [
  "core/src/com/agateau/pixelwheels/ZLevel.java",
  "core/src/com/agateau/pixelwheels/bonus/Missile.java",
  "core/src/com/agateau/pixelwheels/racer/VehicleRenderer.java",
  "core/src/com/agateau/pixelwheels/racescreen/GameRenderer.java",
