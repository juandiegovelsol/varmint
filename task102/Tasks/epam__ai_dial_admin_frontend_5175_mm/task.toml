difficulty_explanation = """
current.png is rendered headlessly from this task's buggy build (real grid components, the app's own stylesheets and dark palette), so it shows every defect the model starts from: uppercase, letter-spaced labels of mixed sizes; SCORE / EXACT_MATCH labels at the left of columns whose values sit at the right; metric group labels lighter than Execution / Extracted. mockup.png (upstream) shows the target look on another page: small semibold sentence-case labels, numeric labels flush right over their values, evenly spaced header rows, semibold group labels. Neither image names a file, component or grid, and the mockup is itself a second page (Run Comparison) that has to match too.

Root causes a solver has to find by reading code, none of them identifiable from the source alone without the images:
1. The kit styles the grid's own header text span as 10px uppercase letter-spaced text. The app's EllipsisHeader is rendered inside that span and never undoes 'uppercase'/'tracking', and several leaves (Test Case name, Total turns, HTTP, Duration in the run grid; Test Case name and Delta in the comparison grid) do not use it at all and render through the plain default header, so they keep the kit look.
2. Metric columns in the run grid pick their header alignment from the first value the merged schema saw for that metric: a metric whose first result has no value yet (the dashes in current.png's first rows) or never has a value loses the column's right-aligned header class, so its label sits left over right-aligned numbers. Only that header class moves the label (the app right-justifies the header label row for it); restoring just the inner component's right-aligned params changes nothing on screen. A shallow repair (prefer a non-null sample) still breaks for a metric that is empty in every row.
3. The shared group-header component uses regular-weight text, so every custom group label (metric groups in both grids, and the Execution/Extracted groups once wired) is lighter than the semibold group labels in both images.
4. The Run Comparison grid forces 28px group-header rows under a 40px column-header row; the mockup shows evenly spaced header rows, which only measuring the image reveals.

Fixing the obvious typography (1) leaves 2–4 failing; each is caught by its own render-based test that mounts the real grids (ag-grid in jsdom) and reads the look each header label ends up with under the app's real stylesheet (ui-kit CSS plus the app's global.scss compiled by Sass and Tailwind, run through a CSS cascade over the rendered DOM), so any implementation that produces the right header row passes, whether through utility classes, arbitrary values, stylesheet rules, inline styles or a custom header component. Size 13-15px and weight 500-700 are accepted, since the images cannot separate those values. Guards keep text-column headers left-aligned and the Delta header right-aligned, so blanket alignment hacks fail.
"""
