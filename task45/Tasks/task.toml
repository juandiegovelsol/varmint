difficulty_explanation = "The instruction names neither the mechanism nor the file, so the agent has to infer from the two frames that the disagreement lives in the SVG export path rather than the canvas path, and then locate the exporting code itself rather than being pointed at it. The export path disagrees with the canvas in more than one independent way, and the remaining ones are not variations of the first: they involve different quantities in different branches, and fixing the character offset does nothing for them. A candidate that recognises the character offset symptom, fixes it and audits only its immediate surroundings does not score, because the reward is all-or-nothing and the other tests still fail. The tests assert net displacement, scale independence and rotated geometry rather than any particular formula, so no defect can be pattern-matched to one specific edit, and a candidate that breaks export outright fails the guards."
files_edited = [ "src/shapes/Text/TextSVGExportMixin.ts",]
f2p = [ "a raised character is displaced by its own offset and not by twice it", "a lowered character is displaced by its own offset and not by twice it", "characters raised and lowered on the same line each keep their own displacement", "a displaced character on a later line keeps its displacement", "the exported decoration thickness does not change when the text object is scaled", "a character with its own decoration thickness keeps it when the text object is scaled", "a displaced character on a path is offset along its own rotated baseline", ]
p2p = [ "characters with no vertical offset all share the same baseline", "the tspans of a line keep strictly increasing x values when one character is vertically displaced", "a vertically displaced character still carries its own font size", "an unscaled text object still exports a decoration thickness proportional to its declared value", "a character on a path with no displacement is unaffected by the path fix", "exports text background color correctly", ]
tags = [ "multimodal", "visual_bug_fix", "fabricjs",]

