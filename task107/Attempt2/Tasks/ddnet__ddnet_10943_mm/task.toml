cross_file = true
visual_essentiality = "required"
difficulty = "hard"
difficulty_explanation = """
The text never names the hook, the hook collision line, the settings page, a colour, an end point, a width or a tuning. It only says that a line drawn from the player character does not match, at several moments, the clip's opening screen or what happens in the clip right after, that these are independent defects, and that the line must always match both, in every situation. Without the video a solver does not know which line is meant, that the opening screen is the Hook Collisions settings page (legend colours, width 20, preview of a uniform wide line), or that the "what happens right after" yardstick is the fired hook (attaching, falling short, grabbing the second player, bouncing off, creeping out after a tuning change typed in the remote console). The video is the only place the five defects can be told apart. Four were injected on top of the original issue; none of them logs anything, breaks the build or an existing test, and the game physics (server and client prediction) stay correct in every case, so only the rendered line shows them:

1. [original issue, no bug patch] Line missing whenever hook_fire_speed is below 1 (the original issue #10943, bug item 5; src/game/client/components/players.cpp, CPlayers::RenderHookCollLine): the float tuning is copied into an int and the `<= 0` early return fires. Video 0:44-0:50: the remote console shows `tune hook_fire_speed 0.9` being typed; afterwards (0:50-1:02) no line in any direction and the fired hook creeps out. The command text exists only in the frames.
2. [environment/bugs/bug_01.patch] Grazed tees not recognised (src/game/client/gameclient.cpp, CGameClient::IntersectCharacter, the only caller is the line): the tee test uses PhysicalSize() / 2 + 2 (16 units) as radius while the real hook (CCharacterCore::Tick) grabs a tee whose centre is within PhysicalSize() + 2 (30 units) of its path. "Radius = half the size" reads as the correct one, so only comparing with the physics shows it. Video 0:38-0:44: aiming a little over the second player turns the line red and it runs on past them, yet the fired hook grabs them; at 0:36-0:38 the straight aim at them is correctly yellow.
3. [environment/bugs/bug_02.patch] Wide line collapses on diagonals (players.cpp, side vector of the line quads): `direction(pi / 2 - angle(Direction))` is a reflection, not the 90-degree rotation `angle - pi / 2`; it is exact for axis-aligned aims and the width falls to |cos 2a|, a hairline at 45 degrees. Video 0:04-0:17 with the width setting at 20: the line is wide when pointing right, up and left and becomes a hairline around both diagonals of the sweep; the settings preview at 0:00-0:04 shows the uniform wide line it should be.
4. [environment/bugs/bug_03.patch] A wall just past the hook's reach is shown as hookable (players.cpp, step loop): a tidy-looking merge of the colour block into the stop block dropped the `!DoBreak` guard, so a wall reached only by the last, length-clamped step (where the real hook is already retracting and never attaches) gets the "Something hookable" colour. Video 0:17-0:23: green line onto a pillar 12 tiles away, two hooks fired, the player is never pulled; 0:23-0:29: one tile closer, the same green line and the hook attaches and pulls.
5. [environment/bugs/bug_04.patch] A tee standing right behind a thin wall (players.cpp, step loop): each step's tee test runs over the whole step instead of the part in front of the wall the step hit (it now reads like the natural `IntersectCharacter(OldPos, NewPos, ...)`), so the line turns yellow and runs through a one-tile block to the player behind it. Video 0:29-0:36: yellow line through the block to the second player; the fired hook attaches to the block.

Defects 2 and 5 both concern tees but in opposite directions (a tee the hook grabs is missed; a tee it cannot reach is flagged) and in different files. Defect 4 is invisible in code review unless the line is checked against the hook's give-up rule in CCharacterCore::Tick. The upstream fix rewrites RenderHookCollLine and with it removes defects 1, 4 and 5, but it does not touch the quad side vector or IntersectCharacter, so a solver who reconstructs the upstream loop still has defects 2 and 3 left, and a solver who only fixes the int truncation leaves four. The oracle (upstream PR #10951 plus the reversal of the four bug patches) also drops the ghost's hook line call and the Intra parameter; neither is required by the instruction or checked by a test.

The hidden tests run the real DDNet-Server and client headlessly (Xvfb, Mesa llvmpipe) on small maps that the test writes from ASCII layouts (DDNet datafile v4, grass_main / generic_unhookable tiles, the client's own dummy as second tee), aim with xdotool through the normal mouse path, and compare an in-engine screenshot with "always show own hook collision line" off to one with it on (only changed pixels count, HUD and the tee itself masked). Line pixels are classified against the client's default legend colours (inverted legend colours count for presence and reach), and the tests measure how far the line reaches along the aim and how wide it is. Expected outcomes follow the game's hook rules (hook starts 42 units out, 80-unit steps, gives up once a step passes hook_length 380, attaches to hookable ground, bounces off unhookable ground, grabs a tee whose centre is within 30 units of its path). f2p per defect: 1 -> drawn_with_subunit_fire_speed; 2 -> tee_grazed_by_hook_path (path 24 units from a tee 192 units away: tee colour, line ends there); 3 -> width_setting_diagonal_aim (width 20 at 45 degrees: 7-14 px wide); 4 -> wall_past_hook_reach_is_not_hookable (wall face 368 units away: not hookable); 5 -> stops_at_wall_in_front_of_tee (block 208 units away, tee behind it at 256: hookable colour, ends at the block). The p2p guards (normal fire speed: red, ~362-380 units; hookable wall at 336: green, ends there; unhookable wall: red, ends there; tee straight ahead: yellow, ends there; tee clearly missed by ~60 units: no tee colour, full length; tee right in front of a hookable wall, both inside the same hook step (tee 256, wall 272): tee colour, ends at the tee, which rejects fixes that skip the tee test whenever a step hits a wall; wide line on a straight aim) reject over-corrections. Every test runs its scenario a second time from scratch if the first attempt fails (harness noise on a loaded machine); a wrong line is wrong on both attempts. Validated in a dev container: all defects -> the 5 f2p fail (on both attempts), 7 p2p pass; base commit alone -> only test 1 fails; each injected defect alone -> only its own f2p fails; merged fix -> all pass; a non-oracle fix (float tunings kept in the old loop, a separate still-flying flag, a clipped step end, PhysicalSizeVec2().x + 2, the other-handed normal) -> all pass; wrong fixes (tee radius 64, never the hookable colour, always the thin line) each fail a p2p.
"""
