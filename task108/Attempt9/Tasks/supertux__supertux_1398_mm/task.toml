difficulty_explanation = """
The prompt names no file, class, function, object type, place, time or number. It refers only to "the objects Tux grabs" in a 26 s uncut forest clip and says several things that happen with them are not how those objects work in this game. It states every defect in words: while Tux carries one, it is on the wrong side of him; when he throws one, it goes the wrong way and ends up sinking into the ground; Tux can pass through one that is lying on the ground; a creature one lands on turns into ice; and, among the problems only visible in the recording, one slows down at one point while it falls. It states the expected results for the carry, the throw and the rock lying on the ground (held in front of him; thrown the way he is walking, coming to rest on top of the ground; solid for Tux, who stops at them or stands on them). For the fall it points to the clip instead: the game treats everything by the same rules, so the other problems show up in the recording as things that don't match the same kind of thing elsewhere in the same clip (a rock falling freely onto the leaf vs. one crawling down the coin column), or that look out of place in this level (the walking leaf turned into an ice block). Saying what the falling rock passes would give the clue away, so which rock slows down, where, and why (the coin column) are only in the video; the prompt never says which object it is and says nothing about coins. For the creature it gives no expected result beyond behaving like they normally do in this game: "knocked out" would point text-only runs at the rock's own hurt branch, where narrowing it to enemies also fixes defect 0 by accident. The clip was recorded headlessly from this task's own buggy build in the repo's own walking_leaves.stl level (extra rocks, a coin column and a walking leaf placed in it). Wording history: Attempt4 stated defects 1-4 and pointed at defect 0 with a timestamp, but named nothing that covers defect 5 and scoped the fix to "problems with these objects", so no with-image run identified the leaf freeze. Attempt5 named an area for every defect and widened the scope to "involving these objects", and every with-image run found the leaf freeze. Attempt6 kept Attempt5's area names, comparison pointer and scope, and restored Attempt4's statements of defects 1-4 without the timestamp. Attempt7 stated defect 5 in words, because it had no correct counterpart in the clip. Attempt8 also stated defect 0 and the expected result for defect 5 (knocked out), and was solvable without the image. Attempt9 keeps only the defect 0 statement (it slows down at one point), so every defect is stated in the text while the instance and trigger of defect 0 stay in the clip.

Six independent defects in four files (rock.cpp, player.cpp, player.hpp, badguy.cpp); only defect 0 and bug_03 live in rock.cpp, none of which breaks the build or logs anything:
0. [original issue #1398, no bug patch] A falling rock treats touchable objects (coins) as something to land on, so it repeatedly stops on a column of coins and crawls down it.
1. [bug_01, player.cpp position_grabbed_object] The held-object offset is applied on the wrong side, so Tux carries rocks behind him in both directions (and the rock jumps to his front when he lets go).
2. [bug_02, player.cpp release code] The throw direction passed to ungrab is derived from which side of Tux the rock was put down on, with the comparison inverted, so a rock thrown while walking flies backwards.
3. [bug_03, rock.cpp ungrab + collision_solid] A rock thrown while moving stays in the touchable collision group; the code that restores the solid group on landing never runs because touchable objects get no static collisions, so the rock falls through the ground. Needs engine knowledge of collision groups to see.
4. [bug_04, player.hpp/player.cpp collides] A plausible-looking Player::collides override ('Tux walks up to things he can carry and grabs them') skips every portable object that is not being carried, so Tux walks through a resting rock and sinks through it when he jumps on it.
5. [bug_05, badguy.cpp collision_tile] A "simplified" hurt branch freezes any freezable badguy instead of only on icy hazards, so a rock dropped on a walking leaf turns it into an ice block instead of knocking it out (outside the rock code entirely).
Bugs 1-3 stack on the same throw in the clip (held behind, flies backwards, falls through the ground); fixing one leaves the others visible.

Tests (tests/rock_behaviour_test.cpp) load small levels into a real Sector and run the game's own update loop and collision system at 64 fps, driving Tux through his scripting controller. They only read positions and object existence, never implementation details. f2p (7): rock dropped through a coin column reaches the floor within 2 frames of the same drop through open air and uses up no coins (0); carried rock centre is on Tux's facing side, both directions (1); a rock thrown while walking travels at least 16 px forward in 0.25 s (accepts throws down to ~64 px/s), both directions (2); a thrown rock lies still on the floor two seconds later, both directions (3); Tux dropped on a resting rock stands on top of it, and Tux walking into a resting rock is stopped by it (4); a rock dropped from a ledge onto a walking leaf pacing in a two-tile trench right below (so no timing or drop-position assumption) leaves no leaf standing in the room four seconds later (5). p2p (3): the carried rock travels with Tux; a put-down rock lands on the floor; a rock dropped on a resting rock rests on top of it. The old direct-call probe tests (which pinned FORCE_MOVE and exact velocities) were replaced because a correct fix returning a different HitResponse would have failed them.

Validated locally in the task image's toolchain, and by the oracle (1.0) and nop (0.0) runs: buggy tree -> all 7 f2p fail, 3 p2p pass; buggy + solution/fix.patch -> 10/10; each bug alone on the fixed tree fails only its own tests; base commit alone fails only the coin test; an independent alternative fix (early return for touchables, different hold offset, 110 px/s throw, unconditional group restore, override kept but limited to the carried object, reordered freeze branch) passes 10/10.

Known limits: a coin-specific fix for defect 0 passes (the clip only shows coins); the leaf test needs the leaf to leave the room within 4 s, which the game's own knock-out does (kill_fall, used by every object that hits an enemy); the test loop never advances the game clock, so a timer-based removal such as a squish would not count.
"""
