difficulty_explanation = """
Two asks share one bundle, and a correct submission has to resolve both completely.

1. A feature-add: wrap the web platform's Intl.DurationFormat the way the sibling
   formatters in the same directory wrap Intl.RelativeTimeFormat/Intl.DateTimeFormat,
   with the styles and default the instruction's expected-output table specifies, and
   wire it into the same public surface. The upstream PR's own tests import the new
   module directly and never exercise the public barrel, so a synthetic f2p asserts the
   wiring explicitly - a fix that creates the module but forgets the barrel export does
   not score 1.0.

2. Eight injected behavioural regressions across the existing utilities (the date/time
   formatters and the tag-overflow handler): default-option output that drifted from the
   documented conventions, locale pass-through dropped on two independent code paths, a
   narrowed under-a-minute window that renders a nonsense value, an overflow cap that is
   ignored under overflow, and an overflow indicator whose visibility is inverted. Every
   one is invisible to the repository's own committed test suite (verified: 204/204 pass
   bit-identically on clean and injected trees), so no test failure, snapshot, or twin
   data structure hands over a location or a correct value.

The visual evidence is essential rather than corroborating: the instruction withholds
how many things are wrong and where, and names no file, function, or mechanism for the
regressions. The only statement of what is broken is two demo screenshots rendered from
the actual injected code, read against a design-guidance reference table and the demos'
own captions. What keeps it fair is that the demos are self-checking: default-option
calls sit beside explicit-style calls, locales sit side by side, and each overflow row
captions its own configuration - wrong output is always adjacent to output or a caption
showing what right looks like.

Difficulty comes from exhaustiveness: the verifier requires all 16 f2p (and 130 p2p
regression guards), so a solver that implements the duration format perfectly and
repairs most - but not all - of the visible regressions still scores 0.0.
"""
