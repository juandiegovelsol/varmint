difficulty_explanation = """
The instructions establish that the issue occurs during keyboard navigation in manual
selection mode, while the attached GIF reveals the affected interface and the unexpected
outcome of that interaction. The recording shows focus moving to a different tab while the
previously selected tab remains active, followed by an unexpected event in the console. The
visual sequence is therefore required to identify the specific defect and distinguish focus
navigation from an actual selection change.

The task does not identify the custom event, specific navigation keys, affected source files,
internal methods, interaction types, or expected code change. Solving it requires interpreting
the focus and selection states shown in the GIF, locating the relevant keyboard and selection
handling across the component implementation, and correcting the behavior without breaking
ordinary interactions.

The verifier checks observable behavior rather than the reference implementation. Focus-only
keyboard navigation in manual mode must continue moving focus without changing the selected
value or emitting a selection event, while explicitly selecting the focused tab with the
keyboard must update the selection and emit the corresponding event. Existing content-switcher
click, keyboard-selection, selectedIndex, and navigation behavior must continue to work. The
tests do not require particular internal method names, interaction-type values, event-gating
logic, or source structure.
"""
files_edited = [
