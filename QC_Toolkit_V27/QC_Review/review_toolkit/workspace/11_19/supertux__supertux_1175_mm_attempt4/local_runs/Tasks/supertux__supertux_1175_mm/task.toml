title = "Harm in the ice cave does not follow the game's own rules"
repository_name = "SuperTux/supertux"
repo_url = "https://github.com/SuperTux/supertux"
issue_number = 1175
pr_number = 1741
base_commit = "8f0c06e3a0cf20294f960cc48a6bfbaf85bd0ca6"
fix_commit = "729c38744a29de65f6d0228a320bb2d222b96089"
task_type = "temporal_interaction"
language = "C++"
framework = "SuperTux"
cross_file = true
visual_essentiality = "required"
difficulty = "hard"
difficulty_explanation = """
The clip is the only place the seven defects can be told apart from intended behavior. The text names
aspects only (how close harm must come, how a meeting with a creature ends, what a hit costs and what
protects Tux, where harm lands, when things react to Tux) and never names an object, a place, a direction
or a time. Each defect has to be read from the scenes: a creature and Tux both harmed while only standing
next to something; creatures flattened by plain side contact where landing on another one is the normal
way; a powered-up Tux losing everything in one hit next to an ordinary Tux losing one step; a protected Tux
still harmed by the level while creatures he touches are beaten; a blast drawn and acting off to one side of
its source; and something overhead that reacts far too early from one side only, next to one that waits.

The fixes are spread over four files (badguy.cpp, player.cpp, explosion.cpp, stalactite.cpp) and none of
the defects is commented. Two sit in the same function (Player::kill), one as a missing `else` and one as a
timer query that looks equivalent but never reports a running timer. The squish test compares the wrong
edge of Tux's box, the blast is placed on its own centre instead of centred on it, and one range check uses
the vertical constant. The upstream leniency fix (a shrunken box checked against hurting tiles) is needed in
both Player::collision_tile and BadGuy::collision_tile, and the tests check both. The 20 behavioral tests
drive the real game binary through scripted fixture levels and read only Tux's reported position and the
creatures' own dead-scripts, so any correct implementation passes.
"""
files_edited = [
  "src/badguy/badguy.cpp",
  "src/badguy/stalactite.cpp",
  "src/object/explosion.cpp",
  "src/object/player.cpp",
]
