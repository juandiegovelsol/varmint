difficulty_explanation = """
The clip is required: the instruction names none of the affected things and states no symptom. It only says which aspects go wrong (how some parts are put together, what stays visible from close by and from far away, how the pointed-at thing is marked) and gives general rules of correct drawing. Which things are affected and what is wrong with each is only visible in the footage, where every defect has a correctly drawn counterpart of the same kind elsewhere in the clip (the track seen from above versus from far away, the other track corners, the other flight of steps, the other window, the other seat, the other leg of the fence, the ladder on the other wall).

Seven independent defects across five files have to be found and fixed, none commented and each in a different code path: (1) the overlay layer of a tile is pulled toward the camera by a polygon offset, which hides the selection outline on overlaid nodes and makes the track lying on the grass vanish when seen from a distance (tile.cpp/tile.h/nodedef.cpp). Pushing every base layer back instead fixes the outline but still makes the distant track vanish, so the offset may only separate a tile from its own overlay, and keeping a smaller constant pull on the overlay is ruled out by the instruction (nothing is drawn even slightly nearer than the surface it belongs to); (2) the frame-edge neighbour table of connected glass reads the wrong neighbour for the +X vertical edges, so only rows running along X get a bar at a joint and lose their outer edge; (3) quarter turns 1 and 3 of facedir node boxes are swapped, so stairs facing east or west are built backwards, and their outline and collision follow the wrong box; (4) the X entries of the node-box direction table are swapped, so a slab or stair beside a full block on one X side loses its open opposite side; (5) two rows of the raillike curve table carry each other's angle, so two of the four kinds of curve bend the wrong way; (6) the fencelike Z check does not reset its probe position after the X check and looks at the diagonal node, so a fence running along Z stays unjoined while one along X is fine; (7) the wallmounted selection box turns the two Z walls the wrong way, so only the outline (not the drawn sign or ladder) of things on north or south walls floats on the far side of the node. Several are direction-dependent sign, table or copy-paste errors that look plausible in code and are only identifiable by comparing the affected and unaffected instances in the clip.
"""
