difficulty_explanation = """
The prompt never shows the line that was typed, so the reproduction itself exists only in the
screenshot. Two things are visible there and stated nowhere: the colour that survives is the
outermost tag, and the ranges panel lists three ranges that all start at offset 0, each wider
than the one before it, narrowest first. The ranges are therefore correct and only their order is
wrong, which is what separates "the nested tags are being discarded" from "the ranges are being
layered in the wrong order". Those are different pieces of code, and the prose fits both.

The fix is small but has to hold for four branches at once: ranges recorded as tags close, ranges
flushed for tags still open at the end of the parse, tags closed in a different order than opened,
and a tag that closes at the offset it opened at and must record nothing rather than an empty
range. Reversing the list of ranges repairs the screenshot and breaks the pair of unclosed tags
that already works on the untouched tree, which is pinned as pass-to-pass, so under the binary
reward that shortcut scores 0.0.
"""
