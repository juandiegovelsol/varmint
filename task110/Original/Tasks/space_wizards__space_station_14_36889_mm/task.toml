difficulty_explanation = """
The defect is purely a client-side rendering/visibility-timing bug: a sprite layer (the pressure/temperature warning icon) stops reflecting the correct state once the door leaves Closed, and nothing in the code or tests calls this out ahead of time -- only watching the rendered client reveals that the light ignores door state entirely, versus merely being a cosmetic animation quirk.

The fix is not a one-line tweak: it spans two files in different subsystems (the client's FirelockSystem.cs appearance handler and the firelock.yml entity prototype), and requires recognizing why the existing declarative GenericVisualizer component -- which only keys visibility off the raw PressureWarning/TemperatureWarning booleans -- cannot express a conjunction with door state, forcing its removal and a reimplementation inside OnAppearanceChange that re-reads both the alarm data and the current DoorState together. A shallow attempt (e.g. just hiding the layer whenever state != Open) would silently regress the Welded and Denying states, which must still show the warning lights per the real fix's `state == Closed || Welded || Denying` condition -- exactly the kind of case a reviewer only catches by understanding the full DoorState enum and the prototype's other visual layers (bolted/denying), not by reading the bug report alone.
"""
