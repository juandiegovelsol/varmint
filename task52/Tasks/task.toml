difficulty_explanation = """
The instruction names no selector, colour, property, file or CSS API -- and no trigger
either. It is two captures and one sentence saying the earlier look never returns. What
each capture shows, which one came first, and what happened between them are written
into the captures themselves as a caption line; none of it is repeated in the text, so
an agent that does not open the images knows only that some screen changed.

Diffing them yields five independent losses on five different strips -- the red block at
the end of one strip, the teal block at the start of another, the greyed-out block, the
one block a rule singles out by name, and a whole strip that shares one look -- while a
sixth strip is untouched. Those five losses do not share a single line of code. They are
four distinct defects in the machinery that lets Textual reuse one resolved style entry
for several widgets when it re-applies the stylesheet to a group: two misspelt names in
the set of pseudo-classes that must switch that reuse off, an inverted guard that decides
when a widget's own name may be folded out of the reuse key, a reuse key that identifies
a widget's container by type instead of by identity, and a dropped component of the key
that tracks a widget's enabled/disabled state -- the last of those in a different module
from the other three.

Nothing is a typo hunt: three of the four defects are ordinary-looking code, two of them
carrying confident comments that justify the wrong behaviour. Each defect is invisible on
first draw (widgets are resolved one at a time then) and only appears once a whole group
is resolved in one pass, so a reproduction has to drive the re-application path before it
shows anything at all. The strip that still looks right in the second capture rules out
the one shortcut that would sweep all five away at once, and scoring is all-or-nothing:
finding four of the five losses scores exactly the same as finding none.

The difficulty is entirely in locating the four defects, never in guessing extra
requirements. Every graded test asserts one of the differences visible between the two
captures, under the one action their captions name; there is no test for a scenario, a
trigger or a property the captures do not show.
"""
