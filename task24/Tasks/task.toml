visual_essentiality = "required"
difficulty = "medium"
difficulty_explanation = """After stripping, instruction.md states only the precondition (an entire group of related actions removed, as opposed to part of one) plus a bare count signal that more than one menu is affected. It never describes the symptom, never says the word 'submenu', never names a menu surface, and never names which action groups are involved — the second affected surface must be found by understanding the mechanism and searching for other submenus built the same way. The poster carries all of that: it shows the 'Export as' trigger still present and opened onto a submenu holding nothing but the Transparent toggle. That last detail is load-bearing — it rules out the obvious text-only guess of 'hide a submenu that has no children', since a child does remain, and forces the fix to gate on the registered actions instead. The fix itself is non-trivial in a different way: it requires recognizing the existing per-menu-item action-gating pattern used elsewhere in the same files and extending it to the submenu-trigger level across three files (extracting a reusable gated component, wiring useActions() through, and re-exporting it), rather than a one-line guard."""
files_edited = [
  "packages/tldraw/src/lib/ui/components/menu-items.tsx",
  "packages/tldraw/src/lib/ui/components/MainMenu/DefaultMainMenuContent.tsx",
  "packages/tldraw/src/index.ts"
]
f2p = [
  "hides the export-as submenu when all export actions are removed",
  "hides the copy-as submenu when all copy actions are removed",
  "hides the export-all-as submenu when all export-all actions are removed"
]
p2p = [
  "shows the export-as and copy-as submenus by default",
  "keeps the export-as submenu when at least one export action remains",
  "shows the export-all-as submenu by default",
  "keeps the export-all-as submenu when at least one export-all action remains"
]
