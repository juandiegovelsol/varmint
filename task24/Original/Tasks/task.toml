difficulty_explanation = """After stripping, instruction.md describes only the generic symptom class (a submenu trigger surviving when every one of its actions is removed) and no longer names which submenu family is affected. The poster is what narrows this to the export/copy-as submenu group (it shows the 'Export as' trigger open on a near-empty submenu), so locating the right component now depends on the image, not the text alone. The fix itself is non-trivial in a different way: it requires recognizing the existing per-menu-item action-gating pattern used elsewhere in the same files and extending it to the submenu-trigger level across three files (extracting a reusable gated component, wiring useActions() through, and re-exporting it), rather than a one-line guard."""
