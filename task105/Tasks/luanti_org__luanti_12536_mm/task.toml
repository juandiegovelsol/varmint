visual_essentiality = "required"
difficulty = "hard"
difficulty_explanation = """
The text never names an object, a file, a cause, a place or a time in the clip. It says only that several things on the terrace are not drawn the way they were built, names five abstract element types (where objects sit relative to what they belong to, how pieces join their neighbours, the faces blocks show, the water, how plants are laid out) and gives five general rules plus the same-rules pointer; which objects are wrong, and how, is only visible in the video. Eight independent defects sit in four files of the client's map block mesh pipeline. None leaves a compiler warning or a comment, every injected change is a plausible-looking edit (a moved block, a merged lookup, a re-laid table, a coordinated pair of edits that keeps most cases right), and each one only shows in specific configurations, so none is found by auditing one function against the text:

1. Canopy off its trunk (the original issue, src/client/content_mapblock.cpp, drawAutoLightedCuboid): leaves with visual_scale = 1.1 are translated to their node before being scaled, so the canopy drifts up and away from its trunk by an amount that grows with the node's position inside its map block. The unscaled apples stay where the canopy should be. Rule 1 (drawn in its own place).
2. Fence never joins the trunk (src/nodedef.cpp, NodeDefManager::nodeboxConnects): the "target declares connect_sides" branch was widened to every facedir node, so a turnable node that declares no sides (tree trunks) refuses every horizontal connection through the rotation table. Plain blocks, gates and nodes that do declare sides are unaffected. Rule 2 (join every neighbour they are allowed to join).
3. Wall torches twisted (src/client/mesh.cpp, rotateMeshBy6dFacedir): the turn about the node's own vertical axis is applied after the mesh is tilted onto its axis instead of before; the two orders agree only when one of the two rotations is trivial, so 14 of the 24 facedirs of every mesh node come out wrong. The torch on the south side of the post (facedir 8) is right, the other three are not. Rule 1 (turned the way it was placed, fixed to something stays on it).
4. Water sides and flow (src/client/content_mapblock.cpp, calculateCornerLevels / drawLiquidTop): the corner levels are stored transposed and the top surface reads them back transposed, so the surface itself still slopes correctly; but the flow angle and drawLiquidSides read them the normal way. The flowing texture runs across every axis-aligned flow instead of along it, and every side face takes the height of the diagonally mirrored corner, which through the glass wall shows as flat steps with wedge-shaped gaps under the sloping surface. Rules 4 (nothing, solid or water, can be seen into) and 5 (running water looks like it runs the way it flows).
5. See-through slabs (src/client/content_mapblock.cpp, drawNodeboxNode): the per-direction neighbour lookup was merged into one lookup taken from the connection-direction table (top, bottom, front, left, back, right), but the face-culling masks it feeds are in the tile order (+X, -X, +Z, -Z). An exposed +X face is dropped when the -Z neighbour is solid or of the same kind, and an exposed -Z face when the +X neighbour is, so rows of slabs or stairs lose their outer faces. The end slab of the bench keeps its front. Rule 4.
6. Track curves and branches turned (src/client/content_mapblock.cpp, drawRaillikeNode): the base rail quad is laid out turned half a turn and only the slope angles were turned back to match, so straight pieces, crossings and ramps are right while every curve and t-junction is drawn turned 180 degrees, away from the rails it joins. Rule 2 (run towards it).
7. Wheat collapsed (src/client/content_mapblock.cpp, drawPlantlikeQuad): the per-face offset of the hash plant styles is applied after the face is turned, i.e. along world Z instead of along each face's own normal, so a # of four faces becomes a cross pushed a quarter node north. Cross-style plants (grass, apples) have no offset and are unaffected. Rule 1 / "how some plants are laid out".
8. Furnaces facing the column (src/client/mapblock_mesh.cpp, getNodeTile): within every axis group of the facedir tile table, the quarter-turn and three-quarter-turn rows are swapped (the turn about the axis runs the other way). Unturned and half-turned blocks are right, so the north and south furnaces face out while the east and west ones show their fronts on the side against the column; the same error is in all six axis groups. Rule 3 (each face in the right place and the right way round, however it is turned).

Each defect is enough on its own to keep the scene broken, so a partial fix still fails. The hidden tests drive the real MapblockMeshGenerator::generate() over a 3x3x3-block voxel area with test-defined nodes and only check the generated geometry: where a node's vertices end up, which faces exist, and which way its textures run. Every defect has its own f2p, each failing only on its own defect: scaled allfaces node centred on itself; fence joining turned trunks; mesh nodes against their own equally turned node box for all 23 non-zero facedirs and all six wallmounted values; flowing-liquid texture running downstream and side faces meeting the surface, in channels running in all four directions; every face of a slab (next to a full block on each side, rows along X and Z) and of stair flights in four turns that looks into the open is drawn; rail curves and t-junctions in all four orientations; a hash-style plant with one face on each side of its middle inside its node; and the six faces of a turned block (with six distinct textures) against the turn of its own node box, tile and texture orientation, for all 24 facedirs. The p2p guards reject shortcut fixes: block-corner and unscaled leaves, fence rules (nodes it does not list, connect_sides honoured, also turned), upright and ceiling-mounted plants, cross-style plants centred, unrotated and floor-mounted mesh nodes, the liquid surface still sloping along the flow and staying level when even, straight rails and ramps, connected glass frames (a correct distractor in the clip), unturned block faces and the node-box meaning of every facedir (so the tile table cannot be made consistent by turning node boxes instead). In-clip counterparts: canopy (apples and trunk), fence (other posts and the gate), torches (the south torch), slabs (the end slab), furnaces (north and south), track (straights and ramps); the water and the wheat have none and fall under "looks out of place".
"""
