issue_number = 12536
pr_number = 12558
base_commit = "d400a98ef0408ccbd2cc4c72f8b48c3813dfce41"
fix_commit = "b270a46e533eaec289a65440f63eb227f0872286"
task_type = "3d_video"
language = "C++"
framework = "Luanti (Minetest)"
cross_file = false
visual_essentiality = "required"
difficulty = "medium"
difficulty_explanation = """
The render is what tells an engineer this is a positional/geometry bug rather than a texture, lighting, or scale-display issue: the video shows a structurally normal, undistorted canopy sitting away from its own bare trunk, with the gap's size and direction tied to how far the tree is from the world's origin point. Text alone could describe 'leaves look wrong' in many ways (wrong color, flicker, z-fighting, missing faces); only watching the canopy float off a completely bare trunk, and noticing it stays a coherent cube rather than tearing apart, narrows the cause to a whole-node transform ordering mistake tied to distance from (0,0,0).

The fix itself is a four-line reorder in drawAutoLightedCuboid, but content_mapblock.cpp is a large file with a dispatch of draw functions for many different drawtypes (cube, nodebox, plantlike, mesh, liquid, and more), so an engineer first has to identify that leaves use the 'allfaces' cuboid path and land on this specific function. The actual bug -- translating by the node's origin before scaling, which is mathematically equivalent to also scaling the origin itself -- reads as unremarkable code on a casual pass; nothing in the file or any comment flags it. A shallow fix (e.g. only touching the scale branch, or offsetting by a guessed correction factor) would miss that the origin-add must move after the scale unconditionally, and could pass by coincidence for nodes near the origin, which is exactly the boundary the shipped testScaledAllfacesNodeAtOrigin control test guards against.
"""
files_edited = [
  "src/client/content_mapblock.cpp",
]
f2p = [
  "testScaledAllfacesNodeOffset",
]
p2p = [
  "testScaledAllfacesNodeAtOrigin",
  "testUnscaledAllfacesNodeUnaffected",
]
tags = ["multimodal", "3d_video", "visual_bug_fix", "beyond_browser", "luanti (minetest)", "c++", "voxel", "mesh-generation", "3d-rendering", "game-engine"]

