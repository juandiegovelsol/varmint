difficulty_explanation = """
The image is required because the exact shape of the artifact -- a short floating line near the horizon plus two short disconnected leg fragments near the bottom corners, with no continuous side edges connecting them -- is only knowable by rendering the scene; nothing in the base-commit source (no test, no comment, no TODO) says what visual output the unconditional polygon offset actually produces, or that it is specific to overlay-textured nodes like dirt-with-grass rather than generic geometry. Only watching bug.mp4 against expected.mp4 along the same camera path confirms what 'fixed' looks like: the same single, fully-closed four-sided box, not merely a less-faded one.

The fix is not a one-line guard: it spans three files (src/client/tile.cpp, src/client/tile.h, src/nodedef.cpp) and both adds a data-model field (need_polygon_offset on TileLayer, including updating the struct's equality operator and reordering existing fields) and threads it between two different subsystems -- nodedef.cpp's per-tile texture-building pass, where the flag must be computed from whether the *overlay* (layer 1) is actually populated, and tile.cpp's material setup, where the offset must then be applied to the *base* layer (layer 0) with the opposite sign from before. A shallow fix that merely wraps the old 'if (layer == 1)' branch in a null/overlay check without relocating and flipping the sign of the offset would still leave the overlay at an artificially close depth (continuing to occlude the wireframe) or reintroduce the original z-fighting the offset existed to prevent. Getting it right requires understanding OpenGL polygon-offset semantics and their side effect on unrelated depth-tested geometry (the selection wireframe), not just pattern-matching the diff.
"""
files_edited = [
  "src/client/tile.cpp",
  "src/client/tile.h",
  "src/nodedef.cpp",
]
f2p = [
  "TileLayer::applyMaterialOptions does not push an overlay slot toward the camera just because it is layer 1",
]
